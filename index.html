<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CipherStream | by temuulen.t_17</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #a855f7; --bg: #020202; }
        body { font-family: 'JetBrains Mono', monospace; background-color: var(--bg); color: #888; overflow: hidden; }
        #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; filter: blur(80px); opacity: 0.4; }
        
        .terminal-card { 
            background: rgba(10, 10, 10, 0.7); 
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 80px rgba(0,0,0,0.8);
            backdrop-filter: blur(30px);
            width: 100%; max-width: 900px; 
            height: 600px; /* LOCKED HEIGHT */
            display: flex; flex-direction: column;
        }

        /* Fixed scrolling areas with hidden bars */
        .scroll-area { 
            overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; 
        }
        .scroll-area::-webkit-scrollbar { display: none; }

        .btn-toggle {
            background: #111; border: 1px solid #222;
            text-transform: uppercase; font-size: 11px; font-weight: 800; letter-spacing: 2px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-toggle.active { border-color: var(--accent); color: white; box-shadow: 0 0 20px rgba(168, 85, 247, 0.4); }
        
        #output::after { content: '_'; animation: blink 0.8s infinite; color: var(--accent); }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        textarea { background: transparent !important; border: none; outline: none; color: white; resize: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <canvas id="canvas"></canvas>
    
    <div class="w-full max-w-5xl flex flex-col items-center space-y-6" id="terminal-container">
        <div class="text-center">
            <h1 class="text-4xl font-black text-white tracking-[0.5em] italic uppercase mb-2">CIPHER<span class="text-purple-500">STREAM</span></h1>
            <div class="opacity-40 text-[9px] tracking-[0.6em] uppercase">Status: 256-BIT Encrypted</div>
        </div>

        <div class="terminal-card rounded-[40px] p-8 md:p-12 border-t border-white/20 relative">
            
            <div class="flex flex-wrap items-center justify-between gap-4 mb-8 shrink-0">
                <div class="flex gap-2 p-1 bg-black/50 rounded-2xl border border-white/10">
                    <button id="modeInstant" onclick="setSpeed('instant')" class="btn-toggle px-4 py-2 rounded-xl active">Instant</button>
                    <button id="modeFlow" onclick="setSpeed('flow')" class="btn-toggle px-4 py-2 rounded-xl">Flow</button>
                </div>
                <select id="algo" onchange="processUpdate()" class="bg-black border border-white/10 text-white text-[10px] font-bold py-2 px-4 rounded-xl outline-none cursor-pointer uppercase tracking-widest hover:border-purple-500/50 transition-all">
                    <option value="binary">Binary Protocol</option>
                    <option value="hex">Hexadecimal</option>
                    <option value="octal">Octal</option>
                    <option value="decimal">Decimal</option>
                    <option value="a1z26">A1-Z26 Alpha</option>
                </select>
            </div>

            <div class="flex-1 flex flex-col min-h-0 mb-6">
                <div class="flex justify-between items-center mb-2 shrink-0">
                    <button onclick="toggleDirection()" id="dirLabel" class="text-xs font-black text-purple-400 tracking-[0.3em] uppercase">TEXT ➔ CODE</button>
                    <button onclick="clearAll()" class="text-[9px] text-white/10 hover:text-red-400 transition-all uppercase tracking-widest">[ Wipe ]</button>
                </div>
                <div class="flex-1 scroll-area">
                    <textarea id="input" oninput="processUpdate()" placeholder="Enter message..." class="w-full min-h-full text-white text-2xl md:text-3xl font-bold"></textarea>
                </div>
            </div>

            <div class="flex-1 border-t border-white/5 pt-6 flex flex-col min-h-0">
                <div class="flex justify-between items-center mb-2 shrink-0">
                    <span class="text-[9px] font-bold text-white/20 tracking-[0.3em] uppercase">Output Stream</span>
                    <button onclick="copyOutput()" id="copyBtn" class="text-[9px] font-bold text-purple-400 hover:text-white uppercase">[ Copy ]</button>
                </div>
                <div class="flex-1 scroll-area">
                    <div id="output" class="text-white text-xl md:text-2xl font-bold break-all leading-relaxed"></div>
                </div>
            </div>
        </div>

        <div class="w-full max-w-[900px] flex justify-between items-end px-4">
            <div class="flex flex-col gap-1">
                <span class="text-[10px] text-white/20 tracking-widest uppercase">Operator</span>
                <div class="flex gap-4">
                    <a href="https://instagram.com/temuulen.t_17" target="_blank" class="text-xs font-bold text-purple-500/80 hover:text-purple-400">IG: @temuulen.t_17</a>
                    <a href="https://github.com/TemuulenDGC" target="_blank" class="text-xs font-bold text-white/40 hover:text-white">GH: /TemuulenDGC</a>
                </div>
            </div>
            <div class="text-center flex flex-col items-center">
                <span id="year-country" class="text-[10px] text-white/20 tracking-[0.4em] uppercase font-bold">2026 • Germany</span>
            </div>
            <div class="text-right flex flex-col">
                <span class="text-[10px] text-white/20 tracking-widest uppercase">System</span>
                <span class="text-[10px] font-bold text-white/40 tracking-widest">v4.5 Final</span>
            </div>
        </div>
    </div>

    <script>
        // BACKGROUND ANIMATION
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let w, h, particles = [];
        function init() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; particles = []; for(let i = 0; i < 5; i++) { particles.push({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5, size: Math.random() * 300 + 200 }); } }
        function animate() { ctx.clearRect(0, 0, w, h); particles.forEach(p => { p.x += p.vx; p.y += p.vy; if(p.x < 0 || p.x > w) p.vx *= -1; if(p.y < 0 || p.y > h) p.vy *= -1; let g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size); g.addColorStop(0, 'rgba(168, 85, 247, 0.4)'); g.addColorStop(1, 'transparent'); ctx.fillStyle = g; ctx.fillRect(0,0,w,h); }); requestAnimationFrame(animate); }
        window.addEventListener('resize', init); init(); animate();

        // CORE LOGIC
        let isEncoding = true, speed = 'instant', typeTimer;

        function toggleDirection() {
            isEncoding = !isEncoding;
            const label = document.getElementById('dirLabel');
            label.innerText = isEncoding ? "Text ➔ Code" : "Code ➔ Text";
            label.style.color = isEncoding ? "#a855f7" : "#10b981";
            processUpdate();
        }

        function setSpeed(s) {
            speed = s;
            document.getElementById('modeInstant').classList.toggle('active', s === 'instant');
            document.getElementById('modeFlow').classList.toggle('active', s === 'flow');
            processUpdate();
        }

        function processUpdate() {
            const input = document.getElementById('input').value, algo = document.getElementById('algo').value, out = document.getElementById('output');
            clearTimeout(typeTimer);
            if(!input) { out.innerText = ''; return; }
            const result = isEncoding ? encode(input, algo) : decode(input, algo);
            if (speed === 'instant') { out.innerText = result; } 
            else {
                out.innerText = ""; let i = 0;
                function type() { if (i < result.length) { out.innerText += result.charAt(i); i++; typeTimer = setTimeout(type, 5); } }
                type();
            }
        }

        function encode(str, type) { return str.split('').map(char => { const code = char.charCodeAt(0); if (type === 'binary') return code.toString(2).padStart(8, '0'); if (type === 'hex') return code.toString(16).toUpperCase(); if (type === 'octal') return code.toString(8); if (type === 'decimal') return code.toString(10); const c = char.toUpperCase().charCodeAt(0); return (c >= 65 && c <= 90) ? c - 64 : char; }).join(' '); }
        function decode(str, type) { const parts = str.trim().split(/\s+/); try { return parts.map(part => { if (type === 'a1z26') { const n = parseInt(part); return (!isNaN(n) && n >= 1 && n <= 26) ? String.fromCharCode(n + 64) : part; } const base = type === 'binary' ? 2 : type === 'hex' ? 16 : type === 'octal' ? 8 : 10; const code = parseInt(part, base); return isNaN(code) ? part : String.fromCharCode(code); }).join(''); } catch(e) { return "ERR: CORRUPTED"; } }
        
        function copyOutput() { 
            navigator.clipboard.writeText(document.getElementById('output').innerText); 
            const btn = document.getElementById('copyBtn');
            btn.innerText = "[ COPIED ]";
            setTimeout(() => btn.innerText = "[ COPY ]", 2000);
        }
        function clearAll() { document.getElementById('input').value = ""; document.getElementById('output').innerText = ""; }
    </script>
</body>
</html>
