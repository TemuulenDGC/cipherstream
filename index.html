<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="https://example.com/style.css">
    <script src="https://example.com/script.js" defer></script>
</head>
<body>
    <header>
        <h1>Weather Dashboard</h1>
        <form id="search-form">
            <input type="text" id="location" placeholder="Enter a location" required>
            <button type="submit">Search</button>
        </form>
    </header>
    <main id="weather-display">
        <div class="weather-card">
            <h2 class="card-title">City Name</h2>
            <p class="temperature">Temperature: 25°C</p>
            <p class="description">Clear sky</p>
        </div>
        <!-- More weather cards will be appended here -->
    </main>
    <footer>
        <p>&copy; 2026 Weather Dashboard</p>
    </footer>
</body>
</html>
