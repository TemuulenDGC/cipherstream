<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CipherStream | by temuulen.t_17</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #a855f7; --bg: #020202; }
        body { 
            font-family: 'JetBrains Mono', monospace; 
            background-color: var(--bg); 
            color: #888; 
            min-height: 100vh;
            overflow-y: auto; 
            scrollbar-width: none;
        }
        body::-webkit-scrollbar { display: none; }

        #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; filter: blur(100px); opacity: 0.5; }
        
        .terminal-card { 
            background: rgba(10, 10, 10, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 100px rgba(0,0,0,0.9);
            backdrop-filter: blur(40px);
            width: 100%; max-width: 900px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-toggle {
            background: #111; border: 1px solid #222;
            text-transform: uppercase; font-size: 10px; font-weight: 800; letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        .btn-toggle.active { border-color: var(--accent); color: white; box-shadow: 0 0 20px rgba(168, 85, 247, 0.3); }
        
        /* Scaled down Font Sizes for better long-form reading */
        textarea { 
            background: transparent !important; 
            border: none; outline: none; 
            color: white; resize: none;
            overflow: hidden;
            font-size: 1.25rem; /* ~20px instead of 32px */
            line-height: 1.6;
        }

        #output { font-size: 1.125rem; line-height: 1.7; }

        #output::after { content: '_'; animation: blink 0.8s infinite; color: var(--accent); }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .float-anim { animation: float 6s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body class="flex flex-col items-center py-20 px-4">
    <canvas id="canvas"></canvas>
    
    <div class="w-full max-w-5xl flex flex-col items-center space-y-12">
        <div class="text-center float-anim">
            <h1 class="text-4xl md:text-5xl font-black text-white tracking-[0.6em] italic uppercase mb-4">CIPHER<span class="text-purple-500">STREAM</span></h1>
            <div class="opacity-30 text-[10px] tracking-[0.8em] uppercase">Distributed Network • v5.5 Final</div>
        </div>

        <div class="terminal-card rounded-[50px] p-10 md:p-16 border-t border-white/10">
            <div class="flex flex-wrap items-center justify-between gap-6 mb-12">
                <div class="flex gap-3 p-1 bg-black/40 rounded-2xl border border-white/5">
                    <button id="modeInstant" onclick="setSpeed('instant')" class="btn-toggle px-5 py-2.5 rounded-xl active">Instant</button>
                    <button id="modeFlow" onclick="setSpeed('flow')" class="btn-toggle px-5 py-2.5 rounded-xl">Flow</button>
                </div>
                <select id="algo" onchange="processUpdate()" class="bg-black border border-white/10 text-white text-[10px] font-bold py-2.5 px-6 rounded-xl outline-none cursor-pointer uppercase tracking-[0.2em] hover:border-purple-500 transition-all">
                    <option value="binary">Binary (Base-2)</option>
                    <option value="hex">Hexadecimal</option>
                    <option value="octal">Octal</option>
                    <option value="decimal">Decimal</option>
                    <option value="a1z26">A1-Z26 Alpha</option>
                </select>
            </div>

            <div class="mb-12">
                <div class="flex justify-between items-center mb-6">
                    <button onclick="toggleDirection()" id="dirLabel" class="text-xs font-black text-purple-400 tracking-[0.4em] uppercase">TEXT ➔ CODE</button>
                    <button onclick="clearAll()" class="text-[10px] text-white/10 hover:text-red-500 transition-all uppercase tracking-widest">[ Wipe ]</button>
                </div>
                <textarea id="input" oninput="autoExpand(this); processUpdate();" placeholder="Start typing message..." class="w-full font-bold"></textarea>
            </div>

            <div class="border-t border-white/5 pt-12">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-[10px] font-bold text-white/20 tracking-[0.4em] uppercase">Processing Result</span>
                    <button onclick="copyOutput()" id="copyBtn" class="text-[10px] font-bold text-purple-400 hover:text-white uppercase">[ Copy ]</button>
                </div>
                <div id="output" class="text-white font-bold break-all transition-all duration-500"></div>
            </div>
        </div>

        <div class="w-full max-w-[900px] flex flex-wrap justify-between items-end gap-8 pt-10 pb-20 opacity-50">
            <div class="flex flex-col gap-2">
                <span class="text-[9px] tracking-widest uppercase">Lead Developer</span>
                <div class="flex gap-6">
                    <a href="https://instagram.com/temuulen.t_17" target="_blank" class="text-xs font-bold text-purple-400 hover:text-purple-300">@temuulen.t_17</a>
                    <a href="https://github.com/TemuulenDGC" target="_blank" class="text-xs font-bold hover:text-white">GitHub/TemuulenDGC</a>
                </div>
            </div>
            <div class="text-center flex flex-col items-center">
                <span id="year-country" class="text-[10px] tracking-[0.5em] uppercase font-bold">2026 • Germany</span>
            </div>
            <div class="text-right flex flex-col">
                <span class="text-[9px] tracking-widest uppercase">System Status</span>
                <span class="text-[10px] font-bold tracking-widest text-green-500/50">Online</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let w, h, particles = [];
        function init() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; particles = []; for(let i = 0; i < 6; i++) { particles.push({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - 0.5) * 1.2, vy: (Math.random() - 0.5) * 1.2, size: Math.random() * 400 + 300 }); } }
        function animate() { ctx.clearRect(0, 0, w, h); particles.forEach(p => { p.x += p.vx; p.y += p.vy; if(p.x < 0 || p.x > w) p.vx *= -1; if(p.y < 0 || p.y > h) p.vy *= -1; let g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size); g.addColorStop(0, 'rgba(168, 85, 247, 0.4)'); g.addColorStop(1, 'transparent'); ctx.fillStyle = g; ctx.fillRect(0,0,w,h); }); requestAnimationFrame(animate); }
        window.addEventListener('resize', init); init(); animate();

        let isEncoding = true, speed = 'instant', typeTimer, currentResult = "";

        function autoExpand(el) {
            el.style.height = 'inherit';
            el.style.height = el.scrollHeight + 'px';
        }

        function toggleDirection() {
            isEncoding = !isEncoding;
            const label = document.getElementById('dirLabel');
            label.innerText = isEncoding ? "Text ➔ Code" : "Code ➔ Text";
            label.style.color = isEncoding ? "#a855f7" : "#10b981";
            processUpdate();
        }

        function setSpeed(s) {
            speed = s;
            document.getElementById('modeInstant').classList.toggle('active', s === 'instant');
            document.getElementById('modeFlow').classList.toggle('active', s === 'flow');
            
            // IF FLOWING AND USER HITS INSTANT: Stop timer and show full text
            if (speed === 'instant' && typeTimer) {
                clearTimeout(typeTimer);
                document.getElementById('output').innerText = currentResult;
            } else if (speed === 'flow') {
                processUpdate();
            }
        }

        function processUpdate() {
            const input = document.getElementById('input').value, algo = document.getElementById('algo').value, out = document.getElementById('output');
            clearTimeout(typeTimer);
            if(!input) { out.innerText = ''; return; }
            
            currentResult = isEncoding ? encode(input, algo) : decode(input, algo);
            
            if (speed === 'instant') { 
                out.innerText = currentResult; 
            } else {
                out.innerText = ""; let i = 0;
                function type() { 
                    if (i < currentResult.length) { 
                        out.innerText += currentResult.charAt(i); i++; 
                        typeTimer = setTimeout(type, 10);
                        // Auto-scrolling stays for the flex, but can be skipped via Instant button
                        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                    } 
                }
                type();
            }
        }

        function encode(str, type) { return str.split('').map(char => { const code = char.charCodeAt(0); if (type === 'binary') return code.toString(2).padStart(8, '0'); if (type === 'hex') return code.toString(16).toUpperCase(); if (type === 'octal') return code.toString(8); if (type === 'decimal') return code.toString(10); const c = char.toUpperCase().charCodeAt(0); return (c >= 65 && c <= 90) ? c - 64 : char; }).join(' '); }
        function decode(str, type) { const parts = str.trim().split(/\s+/); try { return parts.map(part => { if (type === 'a1z26') { const n = parseInt(part); return (!isNaN(n) && n >= 1 && n <= 26) ? String.fromCharCode(n + 64) : part; } const base = type === 'binary' ? 2 : type === 'hex' ? 16 : type === 'octal' ? 8 : 10; const code = parseInt(part, base); return isNaN(code) ? part : String.fromCharCode(code); }).join(''); } catch(e) { return "ERR: DATA_CORRUPT"; } }
        
        function copyOutput() { navigator.clipboard.writeText(document.getElementById('output').innerText); const btn = document.getElementById('copyBtn'); btn.innerText = "[ COPIED ]"; setTimeout(() => btn.innerText = "[ COPY ]", 2000); }
        function clearAll() { document.getElementById('input').value = ""; document.getElementById('output').innerText = ""; document.getElementById('input').style.height = 'auto'; clearTimeout(typeTimer); }
    </script>
</body>
</html>
