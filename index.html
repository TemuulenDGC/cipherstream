<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CipherStream | by temuulen.t_17</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #a855f7; --bg: #020202; }
        body { font-family: 'JetBrains Mono', monospace; background-color: var(--bg); color: #888; overflow: hidden; }
        #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; filter: blur(80px); opacity: 0.4; }
        .terminal-card { 
            background: rgba(10, 10, 10, 0.7); 
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 80px rgba(0,0,0,0.8);
            backdrop-filter: blur(30px);
            width: 100%; max-width: 900px; min-height: 500px;
        }
        .input-glow:focus { border-color: var(--accent); box-shadow: 0 0 30px rgba(168, 85, 247, 0.15); }
        .btn-toggle {
            background: #111; border: 1px solid #222;
            text-transform: uppercase; font-size: 11px; font-weight: 800; letter-spacing: 2px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-toggle.active { border-color: var(--accent); color: white; box-shadow: 0 0 20px rgba(168, 85, 247, 0.4); }
        #output::after { content: '_'; animation: blink 0.8s infinite; color: var(--accent); }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .glitch-flash { animation: flash 0.2s ease-out; }
        @keyframes flash { 0% { opacity: 0.5; filter: contrast(2); } 100% { opacity: 1; filter: contrast(1); } }
        textarea { scrollbar-width: none; background: transparent !important; border: none; outline: none; color: white; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <canvas id="canvas"></canvas>
    <div class="w-full max-w-5xl flex flex-col items-center space-y-8" id="terminal-container">
        <div class="text-center">
            <h1 class="text-4xl font-black text-white tracking-[0.5em] italic uppercase mb-2">CIPHER<span class="text-purple-500">STREAM</span></h1>
            <div class="opacity-40 text-[9px] tracking-[0.6em] uppercase">Status: 256-BIT Encrypted</div>
        </div>

        <div class="terminal-card rounded-[40px] p-8 md:p-14 border-t border-white/20 relative overflow-hidden">
            <div class="flex flex-wrap items-center justify-between gap-6 mb-10">
                <div class="flex gap-3 p-1.5 bg-black/50 rounded-2xl border border-white/10">
                    <button id="modeInstant" onclick="setSpeed('instant')" class="btn-toggle px-6 py-2.5 rounded-xl active">Instant</button>
                    <button id="modeFlow" onclick="setSpeed('flow')" class="btn-toggle px-6 py-2.5 rounded-xl">Flow</button>
                </div>
                <select id="algo" onchange="processUpdate()" class="bg-black border border-white/10 text-white text-xs font-bold py-3 px-6 rounded-xl outline-none cursor-pointer uppercase tracking-widest hover:border-purple-500/50 transition-all">
                    <option value="binary">Binary Protocol</option>
                    <option value="hex">Hexadecimal</option>
                    <option value="octal">Octal</option>
                    <option value="decimal">Decimal</option>
                    <option value="a1z26">A1-Z26 Alpha</option>
                </select>
            </div>

            <div class="relative mb-10">
                <div class="flex justify-between items-center mb-4">
                    <button onclick="toggleDirection()" id="dirLabel" class="text-xs font-black text-purple-400 tracking-[0.3em] uppercase hover:text-white transition-all">TEXT ➔ CODE</button>
                    <button onclick="clearAll()" class="text-[10px] text-white/20 hover:text-red-400 transition-all uppercase tracking-widest">[ Wipe Terminal ]</button>
                </div>
                <textarea id="input" oninput="processUpdate()" placeholder="Enter message to encrypt..." class="w-full h-40 text-white text-2xl md:text-3xl font-bold transition-all"></textarea>
            </div>

            <div class="pt-10 border-t border-white/5">
                <div class="flex justify-between items-center mb-4 text-[10px] font-bold text-white/20 tracking-[0.3em] uppercase">
                    <span>Output Stream</span>
                    <button onclick="copyOutput()" class="text-purple-400 hover:text-white transition-all tracking-widest">[ Copy Result ]</button>
                </div>
                <div id="output" class="text-white text-xl md:text-2xl font-bold min-h-[60px] break-all leading-relaxed"></div>
            </div>
        </div>

        <div class="w-full max-w-[900px] flex justify-between items-end px-4">
            <div class="flex flex-col gap-1">
                <span class="text-[10px] text-white/20 tracking-widest uppercase">Operator</span>
                <div class="flex gap-4">
                    <a href="https://instagram.com/temuulen.t_17" target="_blank" class="text-xs font-bold text-purple-500/80 hover:text-purple-400">IG: @temuulen.t_17</a>
                    <a href="https://github.com/TemuulenDGC" target="_blank" class="text-xs font-bold text-white/40 hover:text-white">GH: /TemuulenDGC</a>
                </div>
            </div>
            <div class="text-center flex flex-col items-center"><span id="year-country" class="text-[10px] text-white/20 tracking-[0.4em] uppercase font-bold">2026 • Loading...</span></div>
            <div class="text-right flex flex-col"><span class="text-[10px] text-white/20 tracking-widest uppercase">System</span><span class="text-[10px] font-bold text-white/40 tracking-widest">v4.0 Final</span></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let w, h, particles = [];
        function init() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; particles = []; for(let i = 0; i < 5; i++) { particles.push({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2, size: Math.random() * 300 + 200 }); } }
        function animate() { ctx.clearRect(0, 0, w, h); particles.forEach(p => { p.x += p.vx; p.y += p.vy; if(p.x < 0 || p.x > w) p.vx *= -1; if(p.y < 0 || p.y > h) p.vy *= -1; let g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size); g.addColorStop(0, 'rgba(168, 85, 247, 0.4)'); g.addColorStop(1, 'transparent'); ctx.fillStyle = g; ctx.fillRect(0,0,w,h); }); requestAnimationFrame(animate); }
        window.addEventListener('resize', init); init(); animate();
        let isEncoding = true, speed = 'instant', typeTimer;
        fetch('https://ipapi.co/json/').then(res => res.json()).then(data => { document.getElementById('year-country').innerText = `2026 • ${data.country_name || 'Germany'}`; }).catch(() => { document.getElementById('year-country').innerText = "2026 • Germany"; });
        function toggleDirection() { isEncoding = !isEncoding; const label = document.getElementById('dirLabel'); document.getElementById('terminal-container').classList.add('glitch-flash'); setTimeout(() => document.getElementById('terminal-container').classList.remove('glitch-flash'), 200); label.innerText = isEncoding ? "Text ➔ Code" : "Code ➔ Text"; label.style.color = isEncoding ? "#a855f7" : "#10b981"; processUpdate(); }
        function setSpeed(s) { speed = s; document.getElementById('modeInstant').classList.toggle('active', s === 'instant'); document.getElementById('modeFlow').classList.toggle('active', s === 'flow'); processUpdate(); }
        function processUpdate() { const input = document.getElementById('input').value, algo = document.getElementById('algo').value, out = document.getElementById('output'); clearTimeout(typeTimer); if(!input) { out.innerText = ''; return; } const result = isEncoding ? encode(input, algo) : decode(input, algo); if (speed === 'instant') { out.innerText = result; } else { out.innerText = ""; let i = 0; function type() { if (i < result.length) { out.innerText += result.charAt(i); i++; typeTimer = setTimeout(type, 10); } } type(); } }
        function encode(str, type) { return str.split('').map(char => { const code = char.charCodeAt(0); if (type === 'binary') return code.toString(2).padStart(8, '0'); if (type === 'hex') return code.toString(16).toUpperCase(); if (type === 'octal') return code.toString(8); if (type === 'decimal') return code.toString(10); const c = char.toUpperCase().charCodeAt(0); return (c >= 65 && c <= 90) ? c - 64 : char; }).join(' '); }
        function decode(str, type) { const parts = str.trim().split(/\s+/); try { return parts.map(part => { if (type === 'a1z26') { const n = parseInt(part); return (!isNaN(n) && n >= 1 && n <= 26) ? String.fromCharCode(n + 64) : part; } const base = type === 'binary' ? 2 : type === 'hex' ? 16 : type === 'octal' ? 8 : 10; const code = parseInt(part, base); return isNaN(code) ? part : String.fromCharCode(code); }).join(''); } catch(e) { return "ERR: CORRUPTED"; } }
        function copyOutput() { navigator.clipboard.writeText(document.getElementById('output').innerText); }
        function clearAll() { document.getElementById('input').value = ""; document.getElementById('output').innerText = ""; }
    </script>
</body>
</html>
